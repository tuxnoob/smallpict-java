name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Java ${{ matrix.java-version }})
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        java-version: ["17", "21"]

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java-version }}
          distribution: "temurin"
          cache: "maven"

      - name: Run Tests
        run: mvn clean test
